<form slot="body" is="gs-ext-form"  class="flex-fill py-3" novalidate="" autocomplete="off">
    
    <gs-form-group css="m-1" name="type" label="Restart type" 
		description="If 'restart' selected, manual server start might be required.">
    	<template>
			<select class="form-select" id="type" name="type"  autofocus required>
                <option value="false" selected>Reload</option>
            	<option value="true">Restart</option>
            </select>
        </template>
    </gs-form-group>
    
</form>
