<form slot="body" is="gs-ext-form"  class="flex-fill py-3" novalidate autocomplete="off">

    <div class="row form-group m-1">
        <div class="col-3"></div>
        <div class="col-6">
            <input class="form-control d-none" id="user"  name="user" type="text" autocomplete="off" placeholder="...enter user" autofocus required disabled>
        </div>
    </div>

    <div class="row form-group m-1">
        <div class="col-3"></div>
        <div class="col-6">
            <input class="form-control d-none" id="password"  name="password" type="password" autocomplete="off" placeholder="...enter password"  reveal autofocus required disabled>
        </div>
    </div>
    
    <div class="row form-group m-1">
        <div class="col-3"></div>
        <div class="col-6">
            <input class="form-control d-none" id="otp" name="otp" type="number" autocomplete="off" maxlength="6" min="0" max="999999"  required disabled placeholder="...enter OTP">
        </div>
    </div>

</form>
